<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ben Kadel - MTG Cards</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../media/ico/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="../media/ico/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../media/ico/favicon-16x16.png">
  <style>
    @font-face { font-family: roboto; src: url("../media/font/Roboto-Regular.ttf"); }
    :root {
      --bg: #0a1118; --panel: #121c27; --panel-hi: #182636; --line: #1f3042; --line-hi: #2a4560;
      --text: #e6edf3; --muted: #8497a9; --blue: #2a5d85; --accent: #e87244; --ok: #5fd68a; --warn: #ff7b72;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; min-height: 100vh; font: 15px/1.4 roboto, system-ui, sans-serif; color: var(--text);
           background: radial-gradient(ellipse at top, #12263a 0%, var(--bg) 55%) fixed; }

    header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
             padding: 8px 14px; font-size: 14px; background: rgba(10, 17, 24, 0.85); backdrop-filter: blur(10px);
             -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .home { display: flex; align-items: center; gap: 12px; color: var(--text); text-decoration: none; }
    .home img { width: 2.2em; height: 2.2em; border-radius: 50%; object-fit: cover; border: 2px solid var(--line-hi); transition: 0.3s; }
    .home:hover img { border-color: var(--accent); }
    #status { color: var(--muted); font-size: 12px; }
    #status.ok { color: var(--ok); }
    #status.bad { color: var(--warn); }
    .counts b { color: var(--text); font-weight: normal; }
    header > span { color: var(--muted); }
    label { color: var(--muted); display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
    select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line-hi);
             border-radius: 8px; padding: 4px 8px; }
    select:focus { outline: 1px solid var(--accent); }
    input[type="checkbox"] { accent-color: var(--accent); }

    #search { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line-hi);
              border-radius: 8px; padding: 4px 9px; width: 128px; max-width: 100%; }
    #search::placeholder { color: var(--muted); }
    #search:focus { outline: 1px solid var(--accent); }

    #zoom { position: fixed; z-index: 10; display: none; pointer-events: none; width: 336px; border-radius: 14px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7); border: 1px solid var(--line-hi); background: var(--panel); }
    #zoom img { display: block; width: 100%; border-radius: 13px; }

    .picker { position: relative; }
    .picker > button, .picker .clear { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line-hi);
                                       border-radius: 8px; padding: 4px 10px; cursor: pointer; }
    .picker > button:hover, .picker .clear:hover { border-color: var(--accent); }
    .picker > button.active { border-color: var(--accent); color: var(--accent); }
    #setPanel { position: absolute; top: calc(100% + 8px); left: 0; z-index: 5; width: 300px; max-width: 90vw; padding: 10px;
                background: var(--panel); border: 1px solid var(--line-hi); border-radius: 10px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6); }
    #setPanel[hidden] { display: none; }
    #setPanel .top { display: flex; gap: 8px; margin-bottom: 8px; }
    #setSearch { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line-hi);
                 border-radius: 8px; padding: 4px 8px; }
    #setList { max-height: 50vh; overflow-y: auto; }
    #setList label { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; color: var(--text); }
    #setList label:hover { background: var(--panel-hi); }
    #setList .set-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #setList .set-meta { color: var(--muted); font-size: 12px; }
    #setList .none { color: var(--muted); padding: 6px; }

    .pips { display: inline-flex; gap: 4px; align-items: center; }
    .pip { width: 28px; height: 28px; padding: 2px; border: 2px solid var(--accent); border-radius: 50%; background: rgba(232, 114, 68, 0.12);
           box-shadow: 0 0 8px rgba(232, 114, 68, 0.45); cursor: pointer; transition: 0.2s; }
    .pip img { display: block; width: 100%; height: 100%; }
    .pip:hover { transform: scale(1.1); }
    .pip.off { border-color: var(--line); background: transparent; box-shadow: none; opacity: 0.35; filter: grayscale(1); }
    #resetFilters { width: 28px; height: 28px; padding: 0; font: inherit; font-size: 17px; line-height: 1; color: var(--muted);
                    background: var(--panel); border: 1px solid var(--line-hi); border-radius: 50%; cursor: pointer; transition: 0.2s; }
    #resetFilters:hover { color: var(--accent); border-color: var(--accent); transform: rotate(-90deg); }
    .pip-action { font: inherit; font-size: 12px; color: var(--muted); background: transparent; border: 1px solid var(--line-hi);
                  border-radius: 999px; padding: 2px 9px; cursor: pointer; transition: 0.2s; }
    .pip-action:hover { color: var(--accent); border-color: var(--accent); }
    .cmc { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
    #cmcLabel { min-width: 2.4em; font-size: 13px; color: var(--text); }
    .range { position: relative; width: 80px; height: 26px; cursor: pointer; touch-action: none; user-select: none; }
    .range-track { position: absolute; left: 8px; right: 8px; top: 11px; height: 4px; border-radius: 2px; background: var(--line-hi); }
    .range-fill { position: absolute; top: 11px; height: 4px; border-radius: 2px; background: var(--accent); }
    .range .thumb { position: absolute; top: 5px; width: 16px; height: 16px; border-radius: 50%; background: var(--text);
                    border: 2px solid var(--accent); transition: transform 0.15s; }
    .range .thumb:hover, .range .thumb:focus-visible, .range.dragging .thumb.active { transform: scale(1.2); outline: none; }

    main { padding: 18px 20px 48px; }
    #message { margin: 24px 0; padding: 14px 16px; border: 1px solid var(--warn); border-radius: 10px; color: var(--warn);
               background: var(--panel); display: none; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 12px; }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; overflow: hidden;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; }
    .card:hover { transform: translateY(-3px); border-color: var(--line-hi); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); }
    .card img, .card .noimg { display: block; width: 100%; aspect-ratio: 488 / 680; object-fit: cover; background: var(--panel-hi); }
    .card .noimg { display: flex; align-items: center; justify-content: center; color: var(--muted); }
    .card .info { padding: 6px 8px 8px; border-top: 1px solid var(--line); }
    .card .name { font-size: 13px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .meta { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
    .card .space { display: inline-block; max-width: 100%; margin-top: 4px; padding: 0 7px; border-radius: 999px;
                   color: var(--accent); background: rgba(232, 114, 68, 0.12); font-size: 11px;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: top; }
    .card { position: relative; }
    .card .badge { position: absolute; top: 6px; right: 6px; z-index: 1; min-width: 30px; padding: 2px 8px; border-radius: 999px;
                   background: var(--accent); color: #fff; font-size: 16px; font-weight: bold; text-align: center; line-height: 1.3;
                   box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6); border: 2px solid var(--bg); }
    .card.fresh { animation: flash 1.8s ease-out; }
    @keyframes flash { 0% { box-shadow: 0 0 0 4px var(--accent), 0 0 24px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
  </style>
</head>
<body>
  <header>
    <a class="home" href="../" title="Back to benkadel.com">
      <img src="../media/bk.webp" alt="Ben Kadel">
          </a>
    <span id="status">Connecting...</span>
    <input id="search" type="search" placeholder="Search cards..." autocomplete="off" spellcheck="false">
    <span class="counts" title="Cards you have in total, and how many different cards that is (copies of the same card count once)"><b id="count">0</b> total &middot; <b id="unique">0</b> different</span>
    <button type="button" id="resetFilters" title="Reset all filters and show every card" aria-label="Reset all filters">&#8635;</button>
    <div class="picker" id="setPicker">
      <button type="button" id="setButton">All sets &#9662;</button>
      <div id="setPanel" hidden>
        <div class="top">
          <input id="setSearch" type="search" placeholder="Filter sets..." autocomplete="off" spellcheck="false">
          <button type="button" class="clear" id="setClear">Clear</button>
        </div>
        <div id="setList"></div>
      </div>
    </div>
    <div class="pips" id="colorPips" title="Color identity: click a colour to hide or show those cards"><button type="button" class="pip-action" id="colorsNone" title="Hide every colour">None</button><button type="button" class="pip" data-color="W" title="White" aria-pressed="true"><img src="https://svgs.scryfall.io/card-symbols/W.svg" alt="W"></button><button type="button" class="pip" data-color="U" title="Blue" aria-pressed="true"><img src="https://svgs.scryfall.io/card-symbols/U.svg" alt="U"></button><button type="button" class="pip" data-color="B" title="Black" aria-pressed="true"><img src="https://svgs.scryfall.io/card-symbols/B.svg" alt="B"></button><button type="button" class="pip" data-color="R" title="Red" aria-pressed="true"><img src="https://svgs.scryfall.io/card-symbols/R.svg" alt="R"></button><button type="button" class="pip" data-color="G" title="Green" aria-pressed="true"><img src="https://svgs.scryfall.io/card-symbols/G.svg" alt="G"></button><button type="button" class="pip" data-color="C" title="Colorless" aria-pressed="true"><img src="https://svgs.scryfall.io/card-symbols/C.svg" alt="C"></button><button type="button" class="pip-action" id="colorsAll" title="Show every colour">All</button></div>
    <div class="cmc" title="Mana value (combined mana cost)">CMC
      <div class="range" id="cmcRange">
        <div class="range-track"></div>
        <div class="range-fill" id="cmcFill"></div>
        <div class="thumb" id="cmcLoThumb" role="slider" tabindex="0" aria-label="Minimum mana value"></div>
        <div class="thumb" id="cmcHiThumb" role="slider" tabindex="0" aria-label="Maximum mana value"></div>
      </div>
      <span id="cmcLabel">Any</span>
    </div>
    <label title="Collection space"><select id="spaceFilter"><option value="">All spaces</option></select></label>
    <label title="Show a large card when hovering over it"><input type="checkbox" id="zoomToggle"> Zoom</label>
    <label title="Show copies of the same card once, with a number for how many you have"><input type="checkbox" id="stackToggle"> Stack dupes</label>
  </header>
  <main>
    <div id="message"></div>
    <div id="runs"></div>
  </main>
  <div id="zoom"><img alt=""></div>
  <script type="module" src="viewer.js"></script>
</body>
</html>
