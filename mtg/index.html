<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ben Kadel - MTG Cards</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../media/ico/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="../media/ico/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../media/ico/favicon-16x16.png">
  <style>
    @font-face { font-family: roboto; src: url("../media/font/Roboto-Regular.ttf"); }
    :root {
      --bg: #0a1118; --panel: #121c27; --panel-hi: #182636; --line: #1f3042; --line-hi: #2a4560;
      --text: #e6edf3; --muted: #8497a9; --blue: #2a5d85; --accent: #e87244; --ok: #5fd68a; --warn: #ff7b72;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; min-height: 100vh; font: 15px/1.4 roboto, system-ui, sans-serif; color: var(--text);
           background: radial-gradient(ellipse at top, #12263a 0%, var(--bg) 55%) fixed; }

    header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
             padding: 8px 12px; font-size: 14px; background: rgba(10, 17, 24, 0.85); backdrop-filter: blur(10px);
             -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .home { display: flex; align-items: center; gap: 12px; color: var(--text); text-decoration: none; }
    .home img { width: 2.2em; height: 2.2em; border-radius: 50%; object-fit: cover; border: 2px solid var(--line-hi); transition: 0.3s; }
    .home:hover img { border-color: var(--accent); }
    .status-box { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
    #status { color: var(--muted); font-size: 11px; white-space: pre-line; }
    #status.ok { color: var(--ok); }
    #status.bad { color: var(--warn); }
    .counts { font-size: 12px; line-height: 1.25; display: inline-block; width: 19ch; flex: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .counts b { color: var(--text); font-weight: normal; }
    header > span { color: var(--muted); }
    label { color: var(--muted); display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
    select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line-hi);
             border-radius: 8px; padding: 4px 8px; }
    select:focus { outline: 1px solid var(--accent); }
    input[type="checkbox"] { accent-color: var(--accent); }

    #search { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line-hi);
              border-radius: 8px; padding: 4px 9px; width: 128px; max-width: 100%; }
    #search::placeholder { color: var(--muted); }
    #search:focus { outline: 1px solid var(--accent); }

    #zoom { position: fixed; z-index: 10; display: none; pointer-events: none; width: 336px; border-radius: 14px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7); border: 1px solid var(--line-hi); background: var(--panel); }
    #zoom img { display: block; width: 100%; border-radius: 13px; }

    .picker { position: relative; }
    .picker > button, .picker .clear { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line-hi);
                                       border-radius: 8px; padding: 4px 10px; cursor: pointer; }
    .picker > button:hover, .picker .clear:hover { border-color: var(--accent); }
    .picker > button.active { border-color: var(--accent); color: var(--accent); }
    #setPanel { position: absolute; top: calc(100% + 8px); left: 0; z-index: 5; width: 300px; max-width: 90vw; padding: 10px;
                background: var(--panel); border: 1px solid var(--line-hi); border-radius: 10px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6); }
    #setPanel[hidden] { display: none; }
    #setPanel .top { display: flex; gap: 8px; margin-bottom: 8px; }
    #setSearch { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line-hi);
                 border-radius: 8px; padding: 4px 8px; }
    #setList { max-height: 50vh; overflow-y: auto; }
    #setList label { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; color: var(--text); }
    #setList label:hover { background: var(--panel-hi); }
    #setList .set-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #setList .set-meta { color: var(--muted); font-size: 12px; }
    #setList .none { color: var(--muted); padding: 6px; }

    #typePanel, #optPanel { position: absolute; top: calc(100% + 8px); left: 0; z-index: 5; padding: 10px;
                background: var(--panel); border: 1px solid var(--line-hi); border-radius: 10px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6); }
    #typePanel { width: 260px; max-width: 90vw; }
    #optPanel { left: auto; right: 0; width: 220px; }
    #typePanel[hidden], #optPanel[hidden], #spacePanel[hidden] { display: none; }
    #spacePanel { margin: 2px 0 6px 8px; padding-left: 6px; border-left: 1px solid var(--line-hi); }
    #spaceList { max-height: 40vh; overflow-y: auto; }
    #spaceButton { text-align: left; font: inherit; color: var(--text); background: transparent; border: 0; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
    #spaceButton:hover { background: var(--panel-hi); }
    #spaceButton.active { color: var(--accent); }
    #typePanel .top, #spacePanel .top { display: flex; gap: 8px; margin-bottom: 6px; }
    #typePanel .top .clear, #spacePanel .top .clear { flex: 1; }
    #typeList label, #spaceList label, #optPanel label { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; color: var(--text); }
    #typeList label:hover, #spaceList label:hover, #optPanel label:hover { background: var(--panel-hi); }
    #typePanel .hide-basics { display: flex; gap: 8px; align-items: center; padding: 4px 6px; margin-bottom: 4px; border-bottom: 1px solid var(--line); color: var(--text); }
    #typePanel .sub-head { margin: 8px 0 4px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    #typePanel .sub-hint { opacity: 0.7; }
    #subSearch { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line-hi); border-radius: 8px; padding: 4px 8px; margin-bottom: 4px; }
    #subList { max-height: 32vh; overflow-y: auto; }
    #subList label { display: flex; gap: 8px; align-items: center; padding: 3px 6px; border-radius: 6px; color: var(--text); }
    #subList label:hover { background: var(--panel-hi); }
    #subList .none { color: var(--muted); padding: 6px; }
    #typeList .type-name, #subList .type-name, #spaceList .type-name { flex: 1; }
    #typeList .type-meta, #subList .type-meta, #spaceList .type-meta { color: var(--muted); font-size: 12px; }
    #downloadCsv { display: inline-flex; align-items: center; gap: 6px; }
    #downloadCsv, #redownload { font: inherit; font-size: 12px; color: var(--muted); background: transparent; border: 1px solid var(--line-hi); border-radius: 6px; padding: 4px 8px; margin: 4px 6px; cursor: pointer; }
    #downloadCsv:hover, #redownload:hover { color: var(--accent); border-color: var(--accent); }
    #optPanel { display: flex; flex-direction: column; gap: 2px; }
    #optPanel[hidden] { display: none; }
    .pips { display: inline-flex; gap: 4px; align-items: center; }
    .pip { width: 28px; height: 28px; padding: 2px; border: 2px solid var(--accent); border-radius: 50%; background: rgba(232, 114, 68, 0.12);
           box-shadow: 0 0 8px rgba(232, 114, 68, 0.45); cursor: pointer; transition: 0.2s; }
    .pip img { display: block; width: 100%; height: 100%; }
    .pip:hover { transform: scale(1.1); }
    .pip.off { border-color: var(--line); background: transparent; box-shadow: none; opacity: 0.35; filter: grayscale(1); }
    .pip.rarity { display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; line-height: 1;
                  color: var(--rc); border-color: var(--rc); background: transparent; box-shadow: 0 0 8px var(--rc); }
    .pip.rarity.off { color: var(--muted); border-color: var(--line); box-shadow: none; }
    #resetFilters { width: 28px; height: 28px; padding: 0; font: inherit; font-size: 17px; line-height: 1; color: var(--muted);
                    background: var(--panel); border: 1px solid var(--line-hi); border-radius: 50%; cursor: pointer; transition: 0.2s; }
    #resetFilters:hover { color: var(--accent); border-color: var(--accent); transform: rotate(-90deg); }
    .pip-action { font: inherit; font-size: 12px; color: var(--muted); background: transparent; border: 1px solid var(--line-hi);
                  border-radius: 999px; padding: 2px 9px; cursor: pointer; transition: 0.2s; }
    .pip-action:hover { color: var(--accent); border-color: var(--accent); }
    .seg { display: inline-flex; border: 1px solid var(--line-hi); border-radius: 8px; overflow: hidden; }
    .seg button { font: inherit; font-size: 12px; padding: 3px 9px; color: var(--muted); background: transparent; border: 0; border-left: 1px solid var(--line-hi); cursor: pointer; }
    .seg button:first-of-type { border-left: 0; }
    .seg button svg { display: block; }
    .seg button:hover { color: var(--text); }
    .seg button.on { color: var(--text); background: var(--panel-hi); box-shadow: inset 0 -2px 0 var(--accent); }
    .pip-mini { width: 22px; height: 22px; padding: 0; font: inherit; font-size: 12px; line-height: 1; color: var(--muted); background: transparent;
                border: 1px solid var(--line-hi); border-radius: 50%; cursor: pointer; transition: 0.2s; }
    .pip-mini { display: inline-flex; align-items: center; justify-content: center; }
    .pip-mini svg { display: block; }
    .pip-mini:hover { color: var(--accent); border-color: var(--accent); }
    .cmc { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
    #cmcLabel { min-width: 2.4em; font-size: 13px; color: var(--text); }
    .range { position: relative; width: 64px; height: 26px; cursor: pointer; touch-action: none; user-select: none; }
    .range-track { position: absolute; left: 8px; right: 8px; top: 11px; height: 4px; border-radius: 2px; background: var(--line-hi); }
    .range-fill { position: absolute; top: 11px; height: 4px; border-radius: 2px; background: var(--accent); }
    .range .thumb { position: absolute; top: 5px; width: 16px; height: 16px; border-radius: 50%; background: var(--text);
                    border: 2px solid var(--accent); transition: transform 0.15s; }
    .range .thumb:hover, .range .thumb:focus-visible, .range.dragging .thumb.active { transform: scale(1.2); outline: none; }

    main { padding: 18px 20px 48px; }
    #newBanner { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; padding: 6px 8px 6px 14px; border: 1px solid var(--accent);
                 border-radius: 999px; background: rgba(232, 114, 68, 0.1); font-size: 13px; }
    #newBanner[hidden] { display: none; }
    #newBanner .text { flex: 1; min-width: 0; }
    #newBanner button { font: inherit; font-size: 12px; color: var(--text); background: transparent; border: 1px solid var(--line-hi);
                        border-radius: 999px; padding: 2px 10px; cursor: pointer; }
    #newBanner button:hover { color: var(--accent); border-color: var(--accent); }
    #message { margin: 24px 0; padding: 14px 16px; border: 1px solid var(--warn); border-radius: 10px; color: var(--warn);
               background: var(--panel); display: none; }

    .run-head { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
    .run-head:first-child { margin-top: 0; }
    .run-head .run-title { font-weight: bold; }
    .run-head .run-meta { color: var(--muted); font-size: 13px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 12px; }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; overflow: hidden;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; }
    .card:hover { transform: translateY(-3px); border-color: var(--line-hi); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); }
    .card img, .card .noimg { display: block; width: 100%; aspect-ratio: 488 / 680; object-fit: cover; background: var(--panel-hi); }
    .card .noimg { display: flex; align-items: center; justify-content: center; color: var(--muted); }
    .card .info { padding: 6px 8px 8px; border-top: 1px solid var(--line); flex: 1; display: flex; flex-direction: column; }
    .card .name { font-size: 13px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .meta { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
    .card .space { display: inline-block; max-width: 100%; margin-top: 4px; padding: 0 8px; height: 20px; line-height: 20px; text-align: center; box-sizing: border-box; border-radius: 999px;
                   color: var(--accent); background: rgba(232, 114, 68, 0.12); font-size: 11px;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: top; }
    .card .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; padding-top: 4px; }
    .card .tags .space { margin-top: 0; min-width: 0; }
    .card .rarity { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 20px; height: 20px; padding: 0;
                    border-radius: 50%; font-size: 11px; line-height: 1; box-sizing: border-box; text-align: center;
                    color: var(--rc); border: 1px solid var(--rc); font-weight: bold; }
    .card { position: relative; display: flex; flex-direction: column; }
    .card img, .card .noimg { flex: none; }
    .card .pic { position: relative; flex: none; }
    /* flip button on two-sided cards: bottom corner of the picture */
    .card .flipbtn { position: absolute; right: 6px; bottom: 6px; z-index: 2; width: 30px; height: 30px; padding: 0; border-radius: 50%;
                     display: flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1; cursor: pointer;
                     background: var(--accent); color: #fff; border: 2px solid var(--bg); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6); }
    .card .flipbtn:hover { filter: brightness(1.15); }
    .card.flipped .flipbtn { background: var(--panel-hi); color: var(--accent); border-color: var(--accent); }
    .card .badge { position: absolute; top: 6px; right: 6px; z-index: 1; min-width: 30px; padding: 2px 8px; border-radius: 999px;
                   background: var(--accent); color: #fff; font-size: 16px; font-weight: bold; text-align: center; line-height: 1.3;
                   box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6); border: 2px solid var(--bg); }
    /* foil (shiny) card: gold border, a star badge on the picture and a faint gold shine over it */
    .card.foil { border-color: #e6b422; box-shadow: 0 0 0 1px rgba(230, 180, 34, 0.35); }
    .card.foil .meta { color: #e6b422; }
    .card .foilmark { position: absolute; top: 6px; left: 6px; z-index: 1; width: 26px; height: 26px; border-radius: 50%;
                      display: flex; align-items: center; justify-content: center; font-size: 16px; line-height: 1;
                      background: #e6b422; color: #3b2a00; border: 2px solid var(--bg); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6); }
    /* holographic foil: a rainbow gradient + a white glare, blended over the picture. --mx/--my (glare) and
       --bx/--by (rainbow shift) are set from the mouse position in viewer.js, so it shimmers as you move. */
    .card.foil::after, #zoom.foil::after {
      content: ""; position: absolute; left: 0; right: 0; top: 0; pointer-events: none; z-index: 1;
      background:
        radial-gradient(circle at var(--mx, 30%) var(--my, 25%), rgba(255, 255, 255, 0.7), transparent 50%),
        repeating-linear-gradient(115deg, #ff2d95 0%, #ff9a1f 10%, #f5ee3a 20%, #35f08c 30%, #2bd0ff 40%, #8a63ff 50%, #ff2d95 60%);
      background-size: 100% 100%, 220% 220%;
      background-position: 0 0, var(--bx, 20%) var(--by, 20%);
      mix-blend-mode: color-dodge; filter: saturate(0.9) brightness(0.75);
      opacity: 0.22; transition: opacity 0.25s; }
    .card.foil::after { aspect-ratio: 488 / 680; }
    .card.foil:hover::after { opacity: 0.55; }
    #zoom.foil::after { bottom: 0; border-radius: 13px; opacity: 0.55; }
    .card.fresh { animation: flash 1.8s ease-out; }
    /* loading spinner: shown until the first answer from the database has arrived */
    #loading { display: flex; flex-direction: column; align-items: center; gap: 14px; margin: 80px 0; color: var(--muted); }
    #loading .spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--line-hi);
                        border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #loading .spinner { animation-duration: 3s; } }
    #sortPanel { position: absolute; top: calc(100% + 8px); right: 0; z-index: 5; width: 210px; padding: 10px;
                 background: var(--panel); border: 1px solid var(--line-hi); border-radius: 10px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6); }
    #sortPanel[hidden] { display: none; }
    #sortList label { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; color: var(--text); }
    #sortList label:hover { background: var(--panel-hi); }
    #sortDir { display: flex; justify-content: center; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
    #sortDir .seg button { font-size: 16px; line-height: 1; padding: 4px 22px; }

    .card { transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s, opacity 0.3s; }
    .card.located { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent), 0 0 28px var(--accent); z-index: 1; }
    #ctxMenu { position: fixed; z-index: 20; min-width: 150px; padding: 4px; background: var(--panel); border: 1px solid var(--line-hi);
               border-radius: 8px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6); }
    #ctxMenu[hidden], #locateBar[hidden] { display: none; }
    #ctxMenu button { display: block; width: 100%; padding: 6px 12px; font: inherit; text-align: left; color: var(--text);
                      background: transparent; border: 0; border-radius: 5px; cursor: pointer; }
    #ctxMenu button:hover { background: var(--panel-hi); color: var(--accent); }
    #locateBar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 15; display: flex; align-items: center; gap: 12px;
                 max-width: 92vw; padding: 8px 8px 8px 16px; background: var(--panel); border: 1px solid var(--accent); border-radius: 999px;
                 box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6); font-size: 13px; }
    #locateBar .text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #locateBar button { font: inherit; font-size: 12px; color: var(--muted); background: transparent; border: 1px solid var(--line-hi);
                        border-radius: 999px; padding: 2px 10px; cursor: pointer; }
    #locateBar button:hover { color: var(--accent); border-color: var(--accent); }

    @keyframes flash { 0% { box-shadow: 0 0 0 4px var(--accent), 0 0 24px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
  </style>
</head>
<body>
  <header>
    <a class="home" href="../" title="Back to benkadel.com">
      <img src="../media/bk.webp" alt="Ben Kadel">
          </a>
    <div class="status-box">
      <span id="status">Connecting...</span>
    </div>
    <input id="search" type="search" placeholder="Search cards..." autocomplete="off" spellcheck="false">
    <span class="counts" title="Cards you have in total, and how many different cards that is (copies of the same card count once)"><b id="count">0</b> total<br><b id="unique">0</b> different</span>
    <button type="button" id="resetFilters" title="Reset all filters and show every card" aria-label="Reset all filters">&#8635;</button>
    <div class="picker" id="sortPicker">
      <button type="button" id="sortButton">Sort &#9662;</button>
      <div id="sortPanel" hidden>
        <div id="sortList"><label><input type="radio" name="sortKey" value="added"> Date added</label><label><input type="radio" name="sortKey" value="name"> Name</label><label><input type="radio" name="sortKey" value="cmc"> Mana value</label><label><input type="radio" name="sortKey" value="rarity"> Rarity</label><label><input type="radio" name="sortKey" value="color"> Colour</label><label><input type="radio" name="sortKey" value="set"> Set</label><label><input type="radio" name="sortKey" value="copies"> Copies owned</label></div>
        <div id="sortDir"><div class="seg"><button type="button" data-dir="asc" title="Ascending" aria-label="Ascending">&#8593;</button><button type="button" data-dir="desc" title="Descending" aria-label="Descending">&#8595;</button></div></div>
      </div>
    </div>
    <div class="picker" id="setPicker">
      <button type="button" id="setButton">Sets &#9662;</button>
      <div id="setPanel" hidden>
        <div class="top">
          <input id="setSearch" type="search" placeholder="Filter sets..." autocomplete="off" spellcheck="false">
          <button type="button" class="clear" id="setClear">Clear</button>
        </div>
        <div id="setList"></div>
      </div>
    </div>
    <div class="picker" id="typePicker">
      <button type="button" id="typeButton">Types &#9662;</button>
      <div id="typePanel" hidden>
        <div class="top"><button type="button" class="clear" id="typeClear">Clear</button></div>
        <label class="hide-basics" title="Hide basic lands (Plains, Island, Swamp, Mountain, Forest, Wastes)"><input type="checkbox" id="hideBasics"> Hide basic lands</label>
        <div id="typeList"></div>
        <div class="sub-head">Subtypes <span class="sub-hint">(Mouse, Elf, Equipment...)</span></div>
        <input id="subSearch" type="search" placeholder="Filter subtypes..." autocomplete="off" spellcheck="false">
        <div id="subList"></div>
      </div>
    </div>
    <div class="pips" id="colorPips" title="Color identity: click a colour to hide or show those cards"><button type="button" class="pip-mini" id="colorsNone" title="Hide every colour" aria-label="Hide every colour">&#10005;</button><button type="button" class="pip" data-color="W" title="White" aria-pressed="true"><img src="https://svgs.scryfall.io/card-symbols/W.svg" alt="W"></button><button type="button" class="pip" data-color="U" title="Blue" aria-pressed="true"><img src="https://svgs.scryfall.io/card-symbols/U.svg" alt="U"></button><button type="button" class="pip" data-color="B" title="Black" aria-pressed="true"><img src="https://svgs.scryfall.io/card-symbols/B.svg" alt="B"></button><button type="button" class="pip" data-color="R" title="Red" aria-pressed="true"><img src="https://svgs.scryfall.io/card-symbols/R.svg" alt="R"></button><button type="button" class="pip" data-color="G" title="Green" aria-pressed="true"><img src="https://svgs.scryfall.io/card-symbols/G.svg" alt="G"></button><button type="button" class="pip" data-color="C" title="Colorless" aria-pressed="true"><img src="https://svgs.scryfall.io/card-symbols/C.svg" alt="C"></button><button type="button" class="pip-mini" id="colorsAll" title="Show every colour" aria-label="Show every colour"><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><circle cx="8" cy="2.6" r="1.9"/><circle cx="13.1" cy="6.3" r="1.9"/><circle cx="11.2" cy="12.3" r="1.9"/><circle cx="4.8" cy="12.3" r="1.9"/><circle cx="2.9" cy="6.3" r="1.9"/></svg></button></div>
    <div class="pips" id="rarityPips" title="Rarity: click a rarity to hide or show those cards"><button type="button" class="pip-mini" id="raritiesNone" title="Hide every rarity" aria-label="Hide every rarity">&#10005;</button><button type="button" class="pip rarity" data-rarity="common" title="Common" aria-pressed="true" style="--rc: #b8b8b8">C</button><button type="button" class="pip rarity" data-rarity="uncommon" title="Uncommon" aria-pressed="true" style="--rc: #9fc5d6">U</button><button type="button" class="pip rarity" data-rarity="rare" title="Rare" aria-pressed="true" style="--rc: #e6b422">R</button><button type="button" class="pip rarity" data-rarity="mythic" title="Mythic" aria-pressed="true" style="--rc: #e8502c">M</button><button type="button" class="pip-mini" id="raritiesAll" title="Show every rarity" aria-label="Show every rarity"><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><circle cx="8" cy="2.6" r="1.9"/><circle cx="13.1" cy="6.3" r="1.9"/><circle cx="11.2" cy="12.3" r="1.9"/><circle cx="4.8" cy="12.3" r="1.9"/><circle cx="2.9" cy="6.3" r="1.9"/></svg></button></div>
    <div class="cmc" title="Mana value (combined mana cost)">CMC
      <div class="range" id="cmcRange">
        <div class="range-track"></div>
        <div class="range-fill" id="cmcFill"></div>
        <div class="thumb" id="cmcLoThumb" role="slider" tabindex="0" aria-label="Minimum mana value"></div>
        <div class="thumb" id="cmcHiThumb" role="slider" tabindex="0" aria-label="Maximum mana value"></div>
      </div>
      <span id="cmcLabel">Any</span>
    </div>
    <div class="seg" id="foilSeg" role="group" aria-label="Foil filter" title="Foil (shiny) cards">
      <input type="hidden" id="foilFilter" value="">
      <button type="button" data-foil="" title="All cards">All</button><button type="button" data-foil="foil" title="Foil only"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><polygon points="8,1.5 10.1,5.9 14.9,6.5 11.4,9.8 12.3,14.6 8,12.3 3.7,14.6 4.6,9.8 1.1,6.5 5.9,5.9" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/></svg></button><button type="button" data-foil="normal" title="Non-foil only"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><polygon points="8,1.5 10.1,5.9 14.9,6.5 11.4,9.8 12.3,14.6 8,12.3 3.7,14.6 4.6,9.8 1.1,6.5 5.9,5.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="1.6 1.6" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="picker" id="optPicker">
      <button type="button" id="optButton" title="Display options">&#9881; Options &#9662;</button>
      <div id="optPanel" hidden>
        <button type="button" id="spaceButton" title="Collection spaces: tick the ones to show">Spaces &#9662;</button>
        <div id="spacePanel" hidden>
          <div class="top"><button type="button" class="clear" id="spaceAll">All</button><button type="button" class="clear" id="spaceNone">None</button></div>
          <div id="spaceList"></div>
        </div>
        <label title="Show a large card when hovering over it"><input type="checkbox" id="zoomToggle"> Zoom on hover</label>
        <button type="button" id="downloadCsv" title="Download the cards currently shown as a CSV file (opens in Google Sheets, Excel)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 10a4 4 0 0 1 0 8"/><path d="M12 11v9"/><path d="M8.5 16.5 12 20l3.5-3.5"/></svg>CSV</button>
        <button type="button" id="redownload" title="Wipe this browser's saved copy of the collection and download everything again from Firebase (counts as a full read)">Re-download from server</button>
        <label title="Group the cards under a heading for each scanning run"><input type="checkbox" id="runToggle"> Group by run</label>
        <label title="Show copies of the same card once, with a number for how many you have"><input type="checkbox" id="stackToggle"> Stack dupes</label>
      </div>
    </div>
  </header>
  <main>
    <div id="newBanner" hidden><span class="text"></span><button type="button" id="newShow">Show only these</button><button type="button" id="newDismiss">Dismiss</button></div>
    <div id="message"></div>
    <div id="loading" role="status" aria-live="polite"><div class="spinner"></div><div>Loading cards&hellip;</div></div>
    <div id="runs"></div>
  </main>
  <div id="ctxMenu" hidden><button type="button" data-act="locate">Locate card</button></div>
  <div id="locateBar" hidden><span class="text"></span><button type="button" id="locateClose">Close</button></div>
  <div id="zoom"><img alt=""></div>
  <script type="module" src="viewer.js"></script>
</body>
</html>
